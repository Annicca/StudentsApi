services:
  web:
    image: students-client
    ports:
      - "8080:80"

  api:
    image: students-api
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__DefaultConnection: >-
        Server=db,1433;Database=CollegeDb;User ID=sa;Password=CollegeDb2026!;Encrypt=False

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "CollegeDb2026!"
    volumes:
      - "sql-data:/var/opt/mssql"

volumes:
  sql-data:
